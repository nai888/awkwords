<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Awkwords</title>
  <defs>
    <linearGradient id="bolt" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffe566"/>
      <stop offset="0.55" stop-color="#ffd000"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  <!-- rows of bars, a nod to the original icon's "text" the bolt strikes through -->
  <g fill="#fff" opacity="0.22">
    <rect x="70" y="86" width="26" height="62" rx="9"/>
    <rect x="112" y="86" width="26" height="62" rx="9"/>
    <rect x="154" y="86" width="26" height="62" rx="9"/>
    <rect x="70" y="170" width="26" height="62" rx="9"/>
    <rect x="112" y="170" width="26" height="62" rx="9"/>
  </g>
  <g fill="#000" opacity="0.28">
    <rect x="70" y="372" width="30" height="58" rx="9"/>
    <rect x="124" y="372" width="30" height="58" rx="9"/>
    <rect x="286" y="372" width="30" height="58" rx="9"/>
    <rect x="340" y="372" width="30" height="58" rx="9"/>
    <rect x="394" y="372" width="30" height="58" rx="9"/>
  </g>
  <!-- the lightning bolt -->
  <g transform="translate(259 256) scale(0.88) translate(-259 -256)">
    <polygon points="300,40 148,290 240,290 204,472 370,214 276,214 352,40"
             fill="url(#bolt)" stroke="#b97a00" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="300,40 148,290 188,290 332,46" fill="#fff" opacity="0.35"/>
  </g>
</svg>
